name: Build And Release Desktop

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: '发布或更新的 Release Tag (默认 main)'
        required: false
        default: 'main'
  push:
    tags:
      - 'v*.*.*'
      - '*.*.*'

permissions:
  contents: write

jobs:
  prepare-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Read version from package.json
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          
          # 处理带 v 前缀的 tag 或 workflow_dispatch 自定义 target_tag
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.target_tag }}" ]; then
            tag="${{ github.event.inputs.target_tag }}"
          else
            tag="${GITHUB_REF_NAME:-v$version}"
          fi
          echo "tag_name=${tag}" >> "$GITHUB_OUTPUT"
          echo "检测到版本号: $version (Tag: $tag)"

      - name: Validate tag matches package version
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          expected_version="${{ steps.version.outputs.version }}"
          pushed_tag="${{ github.ref_name }}"
          clean_tag="${pushed_tag#v}"

          if [[ "$clean_tag" != "$expected_version" ]]; then
            echo "❌ 推送的 tag ($pushed_tag) 与 package.json 版本 ($expected_version) 不一致"
            exit 1
          fi
          echo "✅ Tag 与 package.json 版本匹配一致: $pushed_tag"

  create-release:
    needs: prepare-version
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-version.outputs.tag_name }}
          APP_VERSION: ${{ needs.prepare-version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          title="env-pilot v${APP_VERSION}"

          # 读取标准模版并替换版本号，彻底避免 YAML 缩进解析问题
          sed "s/__VERSION__/${APP_VERSION}/g" .github/release-template.md > release_notes.md

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG 已存在，执行更新说明文档..."
            gh release edit "$RELEASE_TAG" \
              --title "$title" \
              --notes-file release_notes.md \
              --draft=false \
              --prerelease=false
          else
            echo "创建新的 Release $RELEASE_TAG ..."
            gh release create "$RELEASE_TAG" \
              --title "$title" \
              --notes-file release_notes.md \
              --target "$GITHUB_SHA"
          fi

          # 若当前发布的不是 main，但存在 tag 叫 main 的 Release，同步更新其说明页面
          if [ "$RELEASE_TAG" != "main" ] && gh release view "main" >/dev/null 2>&1; then
            echo "同步美化更新 main Release 页面说明..."
            gh release edit "main" --title "$title" --notes-file release_notes.md || true
          fi

  release-windows:
    needs:
      - prepare-version
      - create-release
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Standard Tauri Application (Standard NSIS & Portable)
        env:
          GH_TOKEN: ${{ secrets.TOKEN || secrets.GITHUB_TOKEN }}
        run: npm run tauri build

      - name: Build Offline Full Installer with Microsoft WebView2 (linkid=2124701)
        env:
          GH_TOKEN: ${{ secrets.TOKEN || secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsisDir = "src-tauri/target/release/bundle/nsis"
          
          # 1. 暂存已生成的官方标准安装包
          $stdSetup = Get-ChildItem -Path "$nsisDir/*setup*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($stdSetup) {
            Copy-Item -Path $stdSetup.FullName -Destination "$nsisDir/standard-setup.exe" -Force
            Write-Host "✅ 已暂存标准版安装包: $($stdSetup.Name)"
          }

          # 2. 预先通过微软官方永久保留链接验证/下载 (linkid=2124701，彻底杜绝 CDN 哈希轮换 404)
          $offlineInstallerUrl = "https://go.microsoft.com/fwlink/?linkid=2124701"
          Write-Host "🌐 正在通过微软官方永久保留链接拉取 WebView2 离线安装器: $offlineInstallerUrl"
          $tempDir = Join-Path $env:TEMP "webview2_offline"
          New-Item -ItemType Directory -Force -Path $tempDir | Out-Null
          $installerPath = Join-Path $tempDir "MicrosoftEdgeWebView2RuntimeInstallerX64.exe"
          curl.exe -fSLo $installerPath $offlineInstallerUrl
          Write-Host "✅ 微软官方离线包就绪: $installerPath ($([math]::Round((Get-Item $installerPath).Length / 1MB, 2)) MB)"

          # 3. 动态配置 offlineInstaller 模式并编译离线完整版 NSIS
          $tauriConfPath = "src-tauri/tauri.conf.json"
          $conf = Get-Content $tauriConfPath -Raw | ConvertFrom-Json
          if (-not $conf.bundle.windows) {
            $conf.bundle | Add-Member -MemberType NoteProperty -Name "windows" -Value ([PSCustomObject]@{})
          }
          if (-not $conf.bundle.windows.webviewInstallMode) {
            $conf.bundle.windows | Add-Member -MemberType NoteProperty -Name "webviewInstallMode" -Value ([PSCustomObject]@{ type = "offlineInstaller" }) -Force
          } else {
            $conf.bundle.windows.webviewInstallMode.type = "offlineInstaller"
          }
          $conf | ConvertTo-Json -Depth 10 | Set-Content $tauriConfPath -Encoding utf8

          Write-Host "🚀 开始编译含 WebView2 的全离线完整版安装程序..."
          npm run tauri build -- --bundles nsis

          # 恢复原始配置文件
          git checkout -- $tauriConfPath

          # 识别并标记离线完整版产物
          $offlineSetup = Get-ChildItem -Path "$nsisDir/*setup*.exe" | Where-Object { $_.Name -ne "standard-setup.exe" } | Select-Object -First 1
          if ($offlineSetup) {
            Move-Item -Path $offlineSetup.FullName -Destination "$nsisDir/full-offline-setup.exe" -Force
            Write-Host "✅ 离线完整版构建成功: full-offline-setup.exe"
          }

      - name: Standardize and Validate Windows Artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "${{ needs.prepare-version.outputs.version }}"
          $distDir = "dist-artifacts"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null
          $nsisDir = "src-tauri/target/release/bundle/nsis"

          # 1. 查找并标准化 NSIS 安装包 (离线完整版 + 官方标准版)
          $offlineFound = Get-ChildItem -Path "$nsisDir/*offline*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($offlineFound) {
            $offlineTarget = "$distDir/env-pilot-setup-$version-full-offline-x64.exe"
            Copy-Item -Path $offlineFound.FullName -Destination $offlineTarget -Force
            Write-Host "✅ 成功收录含 WebView2 离线完整安装包: $offlineTarget"
          } else {
            Write-Host "⚠️ 未检测到离线安装包产物，跳过该项"
          }

          $stdFound = Get-ChildItem -Path "$nsisDir/*standard*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $stdFound) {
            $stdFound = Get-ChildItem -Path "$nsisDir/*setup*.exe" -ErrorAction SilentlyContinue | Where-Object { $_.Name -notmatch "offline" } | Select-Object -First 1
          }
          if ($stdFound) {
            $setupTarget = "$distDir/env-pilot-setup-$version-x64.exe"
            Copy-Item -Path $stdFound.FullName -Destination $setupTarget -Force
            Write-Host "✅ 成功收录官方标准安装包: $setupTarget"
          } else {
            throw "❌ 未能检测到标准 NSIS 安装程序产物！"
          }

          # 2. 查找并标准化单文件便携版 exe
          $exeFound = Get-ChildItem -Path "src-tauri/target/release" -Filter "*.exe" | Where-Object { 
            $_.Name -notmatch "build|setup|deps|incremental" -and ($_.Name -match "env" -or $_.Name -match "Pilot")
          } | Select-Object -First 1

          if ($exeFound) {
            $portableTarget = "$distDir/env-pilot-portable-$version-x64.exe"
            Copy-Item -Path $exeFound.FullName -Destination $portableTarget -Force
            Write-Host "✅ 成功收录单文件便携版: $portableTarget"

            # 3. 压缩生成绿色免安装 zip
            $zipTarget = "$distDir/env-pilot-$version-win-x64.zip"
            Compress-Archive -Path $portableTarget -DestinationPath $zipTarget -Force
            Write-Host "✅ 成功打包绿色解压包: $zipTarget"
          } else {
            throw "❌ 未能检测到 Release 可执行程序！"
          }

          # 4. 最终清单验证
          Write-Host "--- 最终产物清单 ---"
          Get-ChildItem -Path $distDir | ForEach-Object {
            Write-Host "$($_.Name) - $([math]::Round($_.Length / 1MB, 2)) MB"
          }

      - name: Upload Windows Assets to Release
        env:
          GH_TOKEN: ${{ secrets.TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-version.outputs.tag_name }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem 'dist-artifacts/*' | Select-Object -ExpandProperty FullName

          Write-Host "正在上传 Windows 产物 (安装包 + 便携版 + 绿色解压包) 到 Release: $env:RELEASE_TAG"
          gh release upload $env:RELEASE_TAG @files --clobber
          Write-Host "🎉 全部产物上传成功！"
